version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════
#  DDB — 5-node distributed database
#
#  Nodes:
#    gateway     :8080  – API gateway (metadata + routing, NO row data)
#    mapreducer  :8090  – aggregates cross-shard SELECT results
#    slave-a     :8081  – Go slave,     shard A, MySQL + replica
#    slave-b     :8082  – Python slave, shard B, MySQL + replica
#    slave-c     :8083  – .NET slave,   shard C, MySQL + replica
#    mysql        :3306  – single MySQL instance (dev); in production each
#                          slave would have its own MySQL host
# ═══════════════════════════════════════════════════════════════════════════

services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_SECRET: "change-me-in-production"
      GATEWAY_PORT:   ":8080"
      SLAVE_A_URL:    "http://slave-a:8081"
      SLAVE_B_URL:    "http://slave-b:8082"
      SLAVE_C_URL:    "http://slave-c:8083"
    depends_on:
      - slave-a
      - slave-b
      - slave-c

  mapreducer:
    build: ./mapreducer
    ports:
      - "8090:8090"
    environment:
      MAPREDUCER_PORT: ":8090"

  slave-a:
    build: ./slave-go
    ports:
      - "8081:8081"
    environment:
      SLAVE_PORT:      ":8081"
      GATEWAY_SECRET:  "change-me-in-production"
      MYSQL_HOST:      "mysql"
      MYSQL_PORT:      "3306"
      MYSQL_USER:      "root"
      MYSQL_PASSWORD:  "root"
    depends_on:
      mysql:
        condition: service_healthy

  slave-b:
    build: ./slave-python
    ports:
      - "8082:8082"
    environment:
      SLAVE_PORT:      "8082"
      GATEWAY_SECRET:  "change-me-in-production"
      MYSQL_HOST:      "mysql"
      MYSQL_PORT:      "3306"
      MYSQL_USER:      "root"
      MYSQL_PASSWORD:  "root"
    depends_on:
      mysql:
        condition: service_healthy

  slave-c:
    build: ./slave-dotnet
    ports:
      - "8083:8083"
    environment:
      SLAVE_PORT:      "8083"
      GATEWAY_SECRET:  "change-me-in-production"
      MYSQL_HOST:      "mysql"
      MYSQL_PORT:      "3306"
      MYSQL_USER:      "root"
      MYSQL_PASSWORD:  "root"
    depends_on:
      mysql:
        condition: service_healthy